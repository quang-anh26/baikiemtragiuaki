<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">

<head th:replace="~{fragments/layout :: head(#{category.list.title})}"></head>

<body>
  <nav th:replace="~{fragments/layout :: nav}"></nav>
  <main>
    <div class="row" style="justify-content:space-between">
      <h1 th:text="#{category.list.title}">Categories</h1>
      <a class="btn" th:href="@{/categories/create}" th:text="#{category.create.title}">New category</a>
    </div>

    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card muted" th:if="${#lists.isEmpty(categories)}" th:text="#{category.empty}">No categories.</div>

    <table th:if="${!#lists.isEmpty(categories)}">
      <thead>
        <tr>
          <th>ID</th>
          <th th:text="#{category.field.name}">Name</th>
          <th th:text="#{category.field.description}">Description</th>
          <th th:text="#{category.field.count}">Dishes</th>
          <th th:text="#{common.actions}">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="c : ${categories}">
          <td th:text="${c.id}"></td>
          <td th:text="${c.name}"></td>
          <td th:text="${c.description}"></td>
          <td th:text="${#lists.size(c.dishes)}"></td>
          <td class="actions">
            <a class="btn small secondary" th:href="@{/dishes(categoryId=${c.id})}"
              th:text="#{category.viewDishes}">View dishes</a>
            <a class="btn small secondary" th:href="@{/categories/{id}/edit(id=${c.id})}"
              th:text="#{common.edit}">Edit</a>
            <form class="inline" method="post" th:action="@{/categories/{id}/delete(id=${c.id})}"
              th:onsubmit="'return confirm(\'' + #{common.confirm.delete} + '\');'">
              <button class="btn small danger" type="submit" th:text="#{common.delete}">Delete</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</body>

</html>
