<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">

<head
  th:replace="~{fragments/layout :: head(${category.id == null} ? #{category.create.title} : #{category.edit.title})}">
</head>

<body>
  <nav th:replace="~{fragments/layout :: nav}"></nav>
  <main>
    <h1 th:text="${category.id == null} ? #{category.create.title} : #{category.edit.title}">Category</h1>
    <form class="card" method="post" th:object="${category}"
      th:action="${category.id == null} ? @{/categories/create} : @{/categories/{id}/edit(id=${category.id})}">
      <div class="field">
        <label th:text="#{category.field.name}">Name</label>
        <input type="text" th:field="*{name}">
        <span class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
      </div>
      <div class="field">
        <label th:text="#{category.field.description}">Description</label>
        <textarea rows="3" th:field="*{description}"></textarea>
        <span class="err" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
      </div>
      <div class="row">
        <button class="btn" type="submit" th:text="#{common.save}">Save</button>
        <a class="btn secondary" th:href="@{/categories}" th:text="#{common.cancel}">Cancel</a>
      </div>
    </form>
  </main>
</body>

</html>
