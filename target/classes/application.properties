spring.application.name=dish-manager

# ===== MySQL: ten database = <MSSV>_MID (tu tao neu chua co) =====
spring.datasource.url=jdbc:mysql://localhost:3306/BIT240024_MID?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Giu NGUYEN ten cot/bang (khong doi sang snake_case) de dung tien to MSSV
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=true

# ===== i18n =====
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.thymeleaf.cache=false
server.port=8080
