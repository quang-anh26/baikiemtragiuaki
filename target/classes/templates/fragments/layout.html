<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Title</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #fff;
      --text: #1f2933;
      --muted: #6b7785;
      --primary: #2563eb;
      --danger: #dc2626;
      --ok: #16a34a;
      --border: #dde1e6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    nav {
      background: #111827;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 24px;
    }

    nav a {
      color: #e5e7eb;
      text-decoration: none;
    }

    nav a:hover {
      color: #fff;
    }

    nav .brand {
      font-weight: 700;
      font-size: 18px;
      color: #fff;
    }

    nav .spacer {
      flex: 1;
    }

    nav .lang a {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #4b5563;
      font-size: 13px;
    }

    nav .lang a.active {
      background: #fff;
      color: #111827;
      font-weight: 700;
    }

    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }

    h1 {
      margin-top: 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type=text],
    input[type=number],
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
    }

    .btn {
      display: inline-block;
      padding: 7px 14px;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font: inherit;
      font-size: 14px;
    }

    .btn.secondary {
      background: #fff;
      color: var(--primary);
    }

    .btn.danger {
      background: var(--danger);
      border-color: var(--danger);
    }

    .btn.small {
      padding: 3px 9px;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
    }

    th,
    td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    th {
      background: #eef1f5;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .b-ok {
      background: #dcfce7;
      color: #166534;
    }

    .b-off {
      background: #fee2e2;
      color: #991b1b;
    }

    .b-quick {
      background: #dbeafe;
      color: #1e40af;
    }

    .b-reg {
      background: #fef3c7;
      color: #92400e;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    .alert.success {
      background: #dcfce7;
      color: #166534;
    }

    .alert.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .err {
      color: var(--danger);
      font-size: 13px;
      display: block;
      margin-top: 3px;
    }

    .field {
      margin-bottom: 14px;
    }

    .thumb {
      width: 64px;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
      background: #e5e7eb;
    }

    .noimg {
      width: 64px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e5e7eb;
      color: var(--muted);
      font-size: 11px;
      border-radius: 4px;
      text-align: center;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .gallery img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      background: #e5e7eb;
    }

    .inline {
      display: inline;
    }

    .muted {
      color: var(--muted);
    }

    .actions {
      white-space: nowrap;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
  </style>
</head>

<body>

  <nav th:fragment="nav">
    <span class="brand" th:text="#{app.title}">Dish Management</span>
    <a th:href="@{/dishes}" th:text="#{nav.dishes}">Dishes</a>
    <a th:href="@{/categories}" th:text="#{nav.categories}">Categories</a>
    <a th:href="@{/dishes/create}" th:text="#{nav.create}">New dish</a>
    <span class="spacer"></span>
    <span class="lang">
      <!-- JS giu nguyen toan bo query string (dieu kien tim kiem/loc) va chi doi tham so lang -->
      <a href="#" data-lang="en" th:classappend="${#locale.language == 'en'} ? 'active'"
        onclick="switchLang('en'); return false;" th:text="#{lang.en}">English</a>
      <a href="#" data-lang="vi" th:classappend="${#locale.language == 'vi'} ? 'active'"
        onclick="switchLang('vi'); return false;" th:text="#{lang.vi}">Tiếng Việt</a>
    </span>
    <script>
      function switchLang(lang) {
        var url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.location.href = url.toString();
      }
    </script>
  </nav>

  <div th:fragment="flash">
    <div class="alert success" th:if="${successKey}" th:text="#{${successKey}}"></div>
    <div class="alert error" th:if="${errorKey}" th:text="#{${errorKey}}"></div>
  </div>

</body>

</html>
